<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JPARAISO DIGITAL SOLUTIONS - Full Stack Development & Digital Solutions">
  <title>JPARAISO DIGITAL SOLUTIONS</title>
  
  <!-- --- google fonts --- -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- --- main stylesheet --- -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- --- navigation --- -->
  <nav class="nav" id="nav">
    <div class="container nav-container">
      <a href="#home" class="nav-logo">
        <img src="assets/images/projects/logo.png" alt="JP Digital Solutions Logo">
    </a> 
      <div class="nav-links" id="nav-links"></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </nav>

  <!-- --- hero section --- -->
<section id="home" class="hero">

  <!-- --- floating tools + wireframe --- -->
  <div class="tools-container" id="tools-container">
    <svg class="wireframe" id="wireframe" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="container hero-container">
    <div class="hero-content">
      <h1 class="hero-title"></h1>
      <p class="hero-subtitle"></p>
    </div>
  </div>

  <div class="hero-scroll-indicator">
    <span class="hero-scroll-line"></span>
  </div>

</section>

  <!-- --- services section --- -->
  <section id="services" class="section services">
    <div class="container">
      <h2 class="section-label">Services</h2>
      <div class="services-grid" id="services-grid"></div>
    </div>
  </section>

  <!-- --- work section --- -->
  <section id="work" class="section work">
    <div class="container">
      <h2 class="section-label">VIEW MY WORK</h2>
      <div class="work-grid" id="work-grid"></div>
    </div>
  </section>

  <!-- --- about section --- -->
  <section id="about" class="section about">
    <div class="container">
      <h2 class="section-label">About</h2>
      <div class="about-content" id="about-content"></div>
    </div>
  </section>

  <!-- --- contact section --- -->
  <section id="contact" class="section contact">
    <div class="container">
  
      <h2 class="section-label">Contact</h2>
  
      <div class="contact-content" id="contact-content"></div>
  
      <div class="contact-socials" id="contact-socials"></div>
  
    </div>
  </section>

  <!-- --- footer --- -->
  <footer class="footer">
    <div class="container footer-container">
      <p class="footer-text"></p>
    </div>
  </footer>

  <!-- --- scripts --- -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
